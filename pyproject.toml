[project]
name = "qrt-hackathon"
version = "0.1.0"
description = "QRT x CompSoc hackathon"
readme = "README.md"
authors = [{ name = "Tom Rodger" }]
requires-python = ">=3.12"
dependencies = [
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.uv.build-backend]
module-name = "qrt"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests", "problems"]
addopts = "--import-mode=importlib"
